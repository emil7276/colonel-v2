name: Build Colonel Fried Chicken POS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o colonel_fried_chicken_pos_v2.zip -d app
          shopt -s dotglob
          cp -r app/* .
          rm -rf app

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.2'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: colonel-fried-chicken-v2-apk
          path: build/app/outputs/flutter-apk/app-release.apk
